<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

  <main class="app">
    <form id="search" class="glass search" autocomplete="off">
      <input id="query" type="text" placeholder="Search for a city" aria-label="Search for a city">
      <button type="submit" aria-label="Search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <ul id="results" class="glass results" hidden></ul>
    </form>

    <section class="glass current">
      <p id="place" class="place">Loading…</p>
      <p id="temp" class="temp">--°</p>
      <p id="cond" class="cond"></p>
      <p id="hilo" class="hilo"></p>
    </section>

    <section class="glass card">
      <h2>Hourly forecast</h2>
      <div id="hourly" class="hourly"></div>
    </section>

    <section class="glass card">
      <h2>7-day forecast</h2>
      <div id="daily" class="daily"></div>
    </section>

    <section class="grid">
      <div class="glass tile"><h2>Feels like</h2><p id="feels">--</p></div>
      <div class="glass tile"><h2>Humidity</h2><p id="humidity">--</p></div>
      <div class="glass tile"><h2>Wind</h2><p id="wind">--</p></div>
      <div class="glass tile"><h2>UV index</h2><p id="uv">--</p></div>
    </section>

    <p class="credit">Data from <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
